; Volume Knob firmware for the Elecrow CrowPanel 1.28" HMI ESP32-S3 rotary display
; (240x240 GC9A01, rotary encoder with push button).
;
; Hardware: ESP32-S3R8 (8 MB octal PSRAM), 16 MB QIO flash.
; Framework: Arduino core 3.x via pioarduino (the official PlatformIO espressif32
; platform ships core 2.x).
;
; The knob talks to the Windows companion (companion/) over the native USB
; Serial/JTAG port, so USB CDC on boot is enabled (Serial = USB). See docs/protocol.md.

[platformio]
default_envs = volume_knob

[env:volume_knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8

; QIO 80 MHz flash, OPI PSRAM, USB mode "Hardware CDC and JTAG".
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
; 10 MB app / 896 KB SPIFFS / coredump (same layout as the factory firmware)
board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    lvgl/lvgl@9.3.0
    lovyan03/LovyanGFX@^1.2.7
    adafruit/Adafruit NeoPixel@^1.12.5
